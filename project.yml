name: OGSpeed
options:
  bundleIdPrefix: com.eren2524
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  OGSpeed:
    type: application
    platform: iOS
    sources:
      - path: OGSpeed
      - path: Shared
    dependencies:
      - target: OGSpeedWidget
    info:
      path: OGSpeed/Info.plist
      properties:
        CFBundleDisplayName: OGSpeed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: "OGSpeed fragt bei deiner FRITZ!Box die echte WLAN-Signalstärke ab."
        NSCameraUsageDescription: "Mach ein Foto von deinem Raum, um darauf die WLAN-Wärmekarte zu erstellen."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            fritz.box:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            speedport.ip:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.eren2524.ogspeed.watch]
        CFBundleURLTypes:
          - CFBundleURLName: com.eren2524.ogspeed
            CFBundleURLSchemes: [ogspeed]
    entitlements:
      path: OGSpeed/OGSpeed.entitlements
      properties:
        com.apple.security.application-groups: [group.com.eren2524.ogspeed]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eren2524.ogspeed
        PRODUCT_NAME: OGSpeed
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OGSpeedWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OGSpeedWidget
      - path: Shared
    info:
      path: OGSpeedWidget/Info.plist
      properties:
        CFBundleDisplayName: OGSpeed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OGSpeedWidget/OGSpeedWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.eren2524.ogspeed]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eren2524.ogspeed.widget
        PRODUCT_NAME: OGSpeedWidget
        SKIP_INSTALL: YES
