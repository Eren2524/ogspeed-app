name: OGSpeed IPA bauen
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: ver
        run: echo "version=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([0-9.]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild -project OGSpeed.xcodeproj -scheme OGSpeed -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/OGSpeed.app

      - name: Fehler anzeigen
        if: failure()
        run: grep -n "error:" build.log | head -60 || true

      - name: IPAs packen
        run: |
          APP=build/Build/Products/Release-iphoneos/OGSpeed.app
          # 1) Standard: ohne Widget und ohne Signatur/Entitlements – wie die Schatzkarte,
          #    lässt sich mit SideStore, FlekSt0re, Feather & Co. signieren
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/OGSpeed.app/PlugIns Payload/OGSpeed.app/_CodeSignature
          zip -qry OGSpeed.ipa Payload
          # 2) Mit Widget (App Group, ad-hoc signiert) – nur für SideStore/AltStore
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --force --sign - --entitlements OGSpeedWidget/OGSpeedWidget.entitlements Payload/OGSpeed.app/PlugIns/OGSpeedWidget.appex
          codesign --force --sign - --entitlements OGSpeed/OGSpeed.entitlements Payload/OGSpeed.app
          zip -qry OGSpeed-Widget.ipa Payload
          ls -la *.ipa
          unzip -l OGSpeed.ipa | grep -c PlugIns || true

      - uses: actions/upload-artifact@v4
        with:
          name: OGSpeed-IPA
          path: |
            OGSpeed.ipa
            OGSpeed-Widget.ipa

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="ogspeed-v${VERSION}"
          NOTES=$(awk -v v="## ${VERSION}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          [ -z "$NOTES" ] && NOTES="- Fehlerbehebungen und Verbesserungen."
          printf '%s\n\n<!-- build: %s -->\n' "$NOTES" "${{ github.run_number }}" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $VERSION gibt es schon – IPA wird aktualisiert."
            gh release upload "$TAG" OGSpeed.ipa OGSpeed-Widget.ipa --clobber
          else
            gh release create "$TAG" OGSpeed.ipa OGSpeed-Widget.ipa --title "OGSpeed ${VERSION}" --notes-file notes.md
          fi
